info:
  name: Update a Device ACL
  type: http
  seq: 3

http:
  method: PUT
  url: "{{host}}/api/devices/:deviceId/rules/:ruleId"
  params:
    - name: ruleId
      value: "15"
      type: path
    - name: deviceId
      value: "6"
      type: path
  body:
    type: json
    data: |
      {
        "topic": "sensor/msg",
        "permission": "publish"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
