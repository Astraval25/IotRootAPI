info:
  name: Create Device ACL
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/devices/:deviceId/rules"
  params:
    - name: deviceId
      value: "6"
      type: path
  body:
    type: json
    data: |
      {
        "topic": "sensors/+/humidity",
        "permission": "readwrite"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
