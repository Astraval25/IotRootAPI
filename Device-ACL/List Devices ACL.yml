info:
  name: List Devices ACL
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/devices/:deviceId/rules"
  params:
    - name: deviceId
      value: "6"
      type: path
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
