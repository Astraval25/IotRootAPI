    }
    ```
    - response
    ```json
    {
      "status": true,
      "code": 200,
      "message": "Token refreshed successfully",
      "data": {
        "accessToken": "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzIiwiZW1haWwiOiJhZG1pbkBhc3RyYXZhbC5jb20iLCJ0eXBlIjoiYWNjZXNzIiwiaWF0IjoxNzc3Mjc5NTMyLCJleHAiOjE3NzcyODMxMzIsImp0aSI6IjM3YjY5ZmZkLTdhZjAtNGM1My05Njk0LTMwN2RlZDkzNzBiZCJ9.IMEoA2KrUjUgfQUdleMZ2YsDeb_quO5Sqr8AGh5l0fM",
        "refreshToken": "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzIiwidHlwZSI6InJlZnJlc2giLCJpYXQiOjE3NzcyNzk1MzIsImV4cCI6MTc3NzM2NTkzMiwianRpIjoiOTI1NzEwNTctNmI0OS00OTIyLTk2YjQtZThmOGExOGYwMTg1In0.HrBnnpdyxPj43l9q0fVeXOqOeXgNlEa5Om5NppD9BJA",
        "tokenType": "Bearer",
        "expiresInSeconds": 3600,
        "refreshExpiresInSeconds": 86400
      }
    }
    ```
    POST /api/auth/forgot-password
    - request
    ```json
    {
      "email":"admin@astraval.com"
    }
    ```
    - response
    ```json
    {
      "status": true,
      "code": 200,
      "message": "If the account exists, OTP has been sent",
      "data": null
    }
    ```
    POST /api/auth/reset-password
    - request
    ```json
    {
      "email":"admin@astraval.com",
      "otp":"",
      "newPassword":"newPassword",
    }
    ```
    - response
    ```json 
    {
      "status": true,
      "code": 200,
      "message": "Password reset successful",
      "data": null
    }
    ```
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
